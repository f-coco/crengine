name: Sync from upstream crengine

on:
  schedule:
    - cron: '0 8 * * 5'  # Friday at 08:00 UTC (17:00 JST)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT with the "workflow" scope is needed when upstream changes
          # files under .github/workflows/.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Merge from upstream crengine
        run: |
          git remote add upstream https://github.com/koreader/crengine.git
          git fetch upstream master

          # Merge upstream into our master (which contains vertical-rl changes)
          if ! git merge upstream/master --no-edit; then
            git merge --abort
            echo "MERGE_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Push
        if: env.MERGE_FAILED != 'true'
        run: git push origin master

      - name: Create issue on merge conflict
        if: env.MERGE_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync failed: merge conflict',
              body: 'Automatic sync from koreader/crengine failed due to a merge conflict. Manual resolution required.\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['upstream-sync'],
            });
